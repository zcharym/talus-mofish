version: '3'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

vars:
  APP_NAME: "talus-mofish"
  BIN_DIR: "bin"
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{OS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{OS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{OS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  dev:mcp:
    summary: Dev mode with Wails in-app MCP server at http://127.0.0.1:9099/mcp
    env:
      WAILS_MCP: "1"
      EXTRA_TAGS: mcp
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  sqlc:
    summary: Regenerate type-safe queries from backend/storage/schema.sql and backend/storage/queries
    cmds:
      - sqlc generate

  db:path:
    summary: Print the default SQLite database file path
    cmds:
      - go run ./cmd/dbpath

  watch:build:
    summary: Build the echo-watch screen monitor CLI
    cmds:
      - go build -o {{.BIN_DIR}}/echo-watch.exe ./cmd/echo-watch

  watch:run:
    summary: Run echo-watch with optional config path (CONFIG=path)
    cmds:
      - go run ./cmd/echo-watch {{if .CONFIG}}--config {{.CONFIG}}{{end}}

  watch:deploy:
    summary: Deploy echo-watch Cloudflare Worker (includes PWA assets)
    dir: cloud/echo-watch/worker
    cmds:
      - npm install
      - npx wrangler deploy

  watch:dev:
    summary: Run echo-watch Worker locally with wrangler dev
    dir: cloud/echo-watch/worker
    cmds:
      - npm install
      - npx wrangler dev

  vdiupload:build:
    summary: Build the vdi-upload CLI (H3C / VDI file transfer)
    cmds:
      - go build -o {{.BIN_DIR}}/vdi-upload.exe ./cmd/vdi-upload

  vdiupload:run:
    summary: Run vdi-upload (CONFIG=path PROFILE=name FILE=path)
    cmds:
      - go run ./cmd/vdi-upload {{if .CONFIG}}--config {{.CONFIG}}{{end}} {{if .PROFILE}}--profile {{.PROFILE}}{{end}} {{if .FILE}}--file {{.FILE}}{{end}}

  vdiupload:test:
    summary: Unit-test vdiupload domain package
    cmds:
      - go test ./backend/vdiupload/...

